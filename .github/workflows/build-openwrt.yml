name: Build OpenWrt

on:
  push:
    branches:
      - main
      - master
      - 'fanchmwrt-*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      target:
        description: 'Target platform / 目标平台'
        required: true
        default: 'x86-64'
        type: choice
        options:
          - x86-64
          - ramips-mt7621
          - cudy_tr3000-256mb-v1  # ← 新增：TR3000 256MB 支持

env:
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    # =========================================================================
    # Step 1: Checkout / 检出代码
    # =========================================================================
    - name: Checkout
      uses: actions/checkout@v4
      # 使用你自己的仓库，包含 configs/ 目录下的配置文件

    # =========================================================================
    # Step 2: Free disk space / 释放磁盘空间
    # =========================================================================
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo docker image prune --all --force
        df -h

    # =========================================================================
    # Step 3: Setup build environment / 配置编译环境
    # =========================================================================
    - name: Setup build environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget

    # =========================================================================
    # Step 4: Update feeds / 更新软件源
    # =========================================================================
    - name: Update feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # =========================================================================
    # Step 5: Load config / 加载配置文件（关键修改）
    # =========================================================================
    - name: Load config
      run: |
        TARGET="${{ github.event.inputs.target }}"
        
        # Default to x86-64 if not specified (push trigger)
        # push 触发时默认使用 x86-64
        if [ -z "$TARGET" ]; then
          TARGET="x86-64"
        fi
        
        echo "========================================"
        echo "Building for target: $TARGET"
        echo "========================================"
        
        # 检查配置文件是否存在，不存在则报错退出
        # 强制要求配置文件必须存在，不使用默认配置
        if [ -f "configs/${TARGET}.config" ]; then
          cp "configs/${TARGET}.config" .config
          echo "✅ Using config: configs/${TARGET}.config"
        else
          echo "::error::❌ Config file configs/${TARGET}.config not found!"
          echo "Available configs:"
          ls -la configs/ 2>/dev/null || echo "No configs directory found"
          exit 1  # ← 强制失败，不使用默认配置
        fi
        
        # 展开配置并显示目标信息
        make defconfig
        echo "========================================"
        echo "Target configuration:"
        cat .config | grep CONFIG_TARGET || echo "No CONFIG_TARGET found"
        echo "========================================"

    # =========================================================================
    # Step 6: Download packages / 下载软件包
    # =========================================================================
    - name: Download packages
      run: |
        make download -j8 V=s || make download -j1 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================================
    # Step 7: Compile firmware / 编译固件
    # =========================================================================
    - name: Compile firmware
      run: |
        echo "Starting build with $(nproc) threads..."
        # 先尝试并行编译，失败则清理后单线程重试
        if ! make -j$(nproc) V=s 2>&1 | tee build.log; then
          echo "⚠️ Parallel build failed, cleaning and retrying with single thread..."
          make clean
          make -j1 V=s 2>&1 | tee build.log
        fi

    # =========================================================================
    # Step 8: Check firmware files / 检查固件文件（新增关键步骤）
    # =========================================================================
    - name: Check firmware files
      run: |
        echo "========================================"
        echo "Checking generated firmware files..."
        echo "========================================"
        
        # 显示生成的所有文件
        find bin/targets -type f 2>/dev/null | head -20 || echo "No files found"
        
        # 检查是否有 sysupgrade 或 factory 固件（关键检查）
        FIRMWARE_FILES=$(find bin/targets -type f \( -name '*sysupgrade*' -o -name '*factory*' \) 2>/dev/null)
        
        if [ -z "$FIRMWARE_FILES" ]; then
          echo "::error::❌ No firmware files (sysupgrade/factory) found!"
          echo "Build may have succeeded but no firmware was generated."
          echo "========================================"
          echo "Directory structure:"
          find bin/ -type f 2>/dev/null || echo "bin/ directory is empty"
          echo "========================================"
          exit 1
        fi
        
        echo "✅ Firmware files generated successfully:"
        find bin/targets -type f \( -name '*sysupgrade*' -o -name '*factory*' \) -exec ls -lh {} \;
        echo "========================================"

    # =========================================================================
    # Step 9: Upload firmware / 上传固件
    # =========================================================================
    - name: Upload firmware
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: openwrt-bin-${{ github.event.inputs.target || 'x86-64' }}
        path: bin/targets/
        # 上传整个 targets 目录，包含所有生成的固件

    # =========================================================================
    # Step 10: Upload build log on failure / 失败时上传日志
    # =========================================================================
    - name: Upload build log on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-log-${{ github.event.inputs.target || 'x86-64' }}
        path: build.log
